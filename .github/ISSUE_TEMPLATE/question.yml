name: Вопрос преподавателю
description: Спросить по текущей работе
labels: ["вопрос"]
body:
  - type: dropdown
    id: course
    attributes:
      label: Курс
      options:
        - Объектно-ориентированный анализ и проектирование
        - Технологии параллельного программирования
        - Технология программирования
    validations:
      required: true
  - type: input
    id: lab
    attributes:
      label: Работа
      placeholder: lab-01
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Вопрос
      description: Что не получается, что уже пробовали, текст ошибки
    validations:
      required: true
